<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחירון קיוסק - לעובד</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background-color: #0d0d0d; 
            color: #ffffff;
            margin: 0;
        }

        /* כרטיס מוצר במראה נקי ומקצועי */
        .price-card {
            background: #1a1a1a; 
            border: 1px solid #2d2d2d;
            border-radius: 1.25rem;
            transition: transform 0.2s;
        }

        .price-tag {
            color: #ffffff;
            background: #262626;
            padding: 2px 10px;
            border-radius: 8px;
            font-weight: 800;
        }

        .category-btn {
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            transition: 0.3s;
        }

        .category-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        input {
            background: #1a1a1a !important;
            border: 1px solid #2d2d2d !important;
            color: white !important;
        }

        /* מניעת גלילה אופקית */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="p-4 border-b border-neutral-800 bg-black/90 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">מחירון <span class="text-neutral-400 font-light">קיוסק</span></h1>
            <button onclick="toggleAdmin()" id="toggleBtn" class="text-[11px] border border-neutral-700 px-3 py-1.5 rounded-lg opacity-50 hover:opacity-100 transition-all">
                עריכת מחירים
            </button>
        </div>
    </header>

    <div class="max-w-5xl mx-auto p-3 md:p-6">
        
        <div id="adminPanel" class="hidden mb-8 p-5 price-card">
            <h2 class="text-sm font-bold mb-4 text-neutral-400">הוספת מוצר חדש למחירון</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <input type="text" id="itemName" placeholder="שם המוצר" class="p-3 rounded-xl text-sm outline-none">
                <input type="number" id="itemPrice" placeholder="מחיר" class="p-3 rounded-xl text-sm outline-none">
                <select id="itemCategory" class="p-3 rounded-xl bg-neutral-900 border border-neutral-800 text-sm outline-none">
                    <option value="שתייה">🥤 שתייה</option>
                    <option value="חטיפים">🍿 חטיפים</option>
                    <option value="סיגריות">🚬 סיגריות</option>
                    <option value="אחר">📦 אחר</option>
                </select>
                <input type="file" id="itemFile" class="text-[10px] p-2 bg-neutral-900 rounded-xl border border-neutral-800">
            </div>
            <button onclick="addProduct()" id="addBtn" class="mt-4 bg-white text-black font-bold px-8 py-3 rounded-xl text-sm hover:bg-neutral-200 transition-all">
                הוסף למחירון
            </button>
        </div>

        <div class="mb-6 space-y-4">
            <div class="relative">
                <i class="fa-solid fa-search absolute right-4 top-1/2 -translate-y-1/2 text-neutral-500"></i>
                <input type="text" id="searchInput" oninput="searchProducts()" placeholder="חיפוש מוצר..." class="w-full pr-12 py-4 rounded-2xl text-lg outline-none focus:border-neutral-500">
            </div>
            
            <nav class="flex gap-2 overflow-x-auto no-scrollbar">
                <button onclick="filterItems('הכל')" class="category-btn active px-6 py-2.5 text-sm font-bold">הכל</button>
                <button onclick="filterItems('שתייה')" class="category-btn px-6 py-2.5 text-sm font-bold">שתייה</button>
                <button onclick="filterItems('חטיפים')" class="category-btn px-6 py-2.5 text-sm font-bold">חטיפים</button>
                <button onclick="filterItems('סיגריות')" class="category-btn px-6 py-2.5 text-sm font-bold">סיגריות</button>
            </nav>
        </div>

        <div id="productsGrid" class="grid grid-cols-2 gap-2 md:gap-4">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let currentFilter = 'הכל';
        let searchQuery = '';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            return data.data.url;
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            if (!name || !price || !file) return alert("מלא פרטים ותמונה");

            try {
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), category, image: imageUrl, createdAt: serverTimestamp() });
                location.reload();
            } catch (e) { alert(e.message); }
        };

        window.deleteItem = async (id) => {
            if (confirm("למחוק מהמחירון?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("מחיר חדש:", oldPrice);
            if (newPrice) await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
        };

        window.filterItems = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'הכל' && btn.innerText === 'הכל'));
            });
            renderProducts(window.lastSnapshot);
        };

        window.searchProducts = () => {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                const matchesFilter = currentFilter === 'הכל' || item.category === currentFilter;
                const matchesSearch = item.name.toLowerCase().includes(searchQuery);

                if (matchesFilter && matchesSearch) {
                    grid.innerHTML += `
                        <div class="price-card flex flex-col h-full overflow-hidden">
                            <div class="h-20 md:h-32 bg-white/5 flex items-center justify-center p-2">
                                <img src="${item.image}" class="max-w-full max-h-full object-contain">
                            </div>
                            <div class="p-2 md:p-3 flex flex-col flex-grow justify-between text-center border-t border-neutral-800">
                                <h3 class="text-[10px] md:text-sm font-semibold truncate mb-1">${item.name}</h3>
                                <div class="flex flex-col items-center gap-1">
                                    <span class="text-white font-black text-sm md:text-xl">₪${item.price}</span>
                                    ${isAdmin ? `
                                        <div class="flex gap-2 mt-2">
                                            <button onclick="updatePrice('${doc.id}', ${item.price})" class="text-neutral-500 text-[10px]"><i class="fa-solid fa-edit"></i></button>
                                            <button onclick="deleteItem('${doc.id}')" class="text-neutral-500 text-[10px]"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
