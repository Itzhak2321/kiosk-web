<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחירון קיוסק דינמי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            min-h-screen;
        }

        /* הכרטיס הראשי שמשמש כמסגרת זזה */
        .product-card {
            position: relative;
            width: 100%;
            border-radius: 1.5rem;
            padding: 3px; /* עובי המסגרת הצבעונית */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
        }

        /* האנימציה של הצבעים המסתובבים */
        .product-card::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(
                #3b82f6, #a855f7, #ef4444, #22c55e, #3b82f6
            );
            animation: rotate 4s linear infinite;
        }

        /* התוכן הפנימי של הכרטיס (מסתיר את האמצע של הגרדיאנט) */
        .card-inner {
            position: relative;
            width: 100%;
            background: #1e293b;
            border-radius: 1.4rem;
            z-index: 1;
            overflow: hidden;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .img-box {
            width: 100%;
            height: 180px;
            background: white; /* רקע לבן לתמונות מוצרים כמו במנטוס */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-box img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .admin-fab {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: #ffffff;
            color: #000;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            z-index: 100;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight">מחירון <span class="text-blue-500">דיגיטלי</span></h1>
    </header>

    <div class="max-w-2xl mx-auto px-4">
        
        <div id="adminPanel" class="hidden mb-8 p-6 bg-slate-800/90 backdrop-blur-md rounded-3xl border border-white/10 z-50 relative">
            <h2 class="text-lg font-bold mb-4">מוצר חדש</h2>
            <div class="grid gap-3">
                <input type="text" id="itemName" placeholder="שם המוצר" class="w-full p-3 rounded-xl bg-slate-900 text-white outline-none">
                <input type="number" id="itemPrice" placeholder="מחיר" class="w-full p-3 rounded-xl bg-slate-900 text-white outline-none">
                <input type="file" id="itemFile" class="text-xs text-slate-400 p-2">
                <button onclick="addProduct()" class="bg-blue-600 text-white font-bold py-3 rounded-xl">הוסף למחירון</button>
            </div>
        </div>

        <div class="mb-6">
            <input type="text" id="searchInput" oninput="searchProducts()" placeholder="חיפוש מהיר..." class="w-full p-4 rounded-2xl bg-slate-800 border-none text-lg outline-none">
        </div>

        <div id="productsGrid" class="grid grid-cols-2 gap-5">
            </div>
    </div>

    <div class="admin-fab" onclick="toggleAdmin()">
        <i id="adminIcon" class="fa-solid fa-pen-nib"></i>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let searchQuery = '';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            return data.data.url;
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const file = document.getElementById('itemFile').files[0];
            if (!name || !price || !file) return alert("חסרים פרטים");

            try {
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), image: imageUrl, createdAt: serverTimestamp() });
                location.reload();
            } catch (e) { alert(e.message); }
        };

        window.deleteItem = async (id) => {
            if (confirm("למחוק?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("עדכן מחיר:", oldPrice);
            if (newPrice) await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
        };

        window.searchProducts = () => {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                if (item.name.toLowerCase().includes(searchQuery)) {
                    grid.innerHTML += `
                        <div class="product-card shadow-2xl">
                            <div class="card-inner">
                                <div class="img-box">
                                    <img src="${item.image}">
                                </div>
                                <div class="p-4 text-center">
                                    <h3 class="text-sm font-bold truncate text-slate-300">${item.name}</h3>
                                    <div class="text-2xl font-black mt-1">₪${item.price}</div>
                                    ${isAdmin ? `
                                        <div class="flex gap-4 justify-center mt-3 border-t border-white/5 pt-3">
                                            <button onclick="updatePrice('${doc.id}', ${item.price})" class="text-blue-400"><i class="fa-solid fa-edit"></i></button>
                                            <button onclick="deleteItem('${doc.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
