<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול קיוסק - העלאה ישירה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">

    <div class="max-w-4xl mx-auto">
        <header class="text-center py-6">
            <h1 class="text-3xl font-bold text-blue-900">ניהול מלאי קיוסק</h1>
            <p class="text-gray-600">העלאת תמונות ומחירים ללא עלות</p>
        </header>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <h2 class="text-xl font-bold mb-4">הוספת מוצר חדש</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="itemName" placeholder="שם המוצר" class="border p-3 rounded-lg w-full">
                <input type="number" id="itemPrice" placeholder="מחיר ב-₪" class="border p-3 rounded-lg w-full">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">בחר תמונה מהמכשיר:</label>
                    <input type="file" id="itemFile" accept="image/*" class="border p-2 rounded-lg w-full bg-gray-50">
                </div>
            </div>
            <button onclick="addProduct(event)" id="addBtn" class="mt-6 bg-blue-600 text-white font-bold px-8 py-3 rounded-lg hover:bg-blue-700 w-full transition shadow-lg disabled:bg-gray-400">
                הוסף מוצר לקטלוג
            </button>
            <div id="status" class="mt-3 text-center font-bold text-blue-600 hidden"></div>
        </div>

        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // הגדרות Firebase המעודכנות שלך
        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            databaseURL: "https://kiosk-web-55899-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "a0286551dfb1f903140c177ff75ca91d";

        // פונקציה להעלאת תמונה ל-ImgBB
        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            
            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    return data.data.url;
                } else {
                    throw new Error(data.error.message || "שגיאה בהעלאה ל-ImgBB");
                }
            } catch (err) {
                throw new Error("נכשל בחיבור ל-ImgBB: " + err.message);
            }
        }

        // פונקציה מרכזית להוספת מוצר
        window.addProduct = async (e) => {
            if (e) e.preventDefault(); // מונע מהדף להתרענן

            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const fileInput = document.getElementById('itemFile');
            const btn = document.getElementById('addBtn');
            const status = document.getElementById('status');

            if (!name || !price || !fileInput.files[0]) {
                alert("נא למלא שם, מחיר ולבחור תמונה");
                return;
            }

            try {
                btn.disabled = true;
                status.innerText = "שלב 1/2: מעלה תמונה...";
                status.classList.remove('hidden');

                // 1. העלאה ל-ImgBB
                const imageUrl = await uploadImage(fileInput.files[0]);
                console.log("Image URL:", imageUrl);

                status.innerText = "שלב 2/2: שומר נתונים...";

                // 2. שמירה ב-Firebase
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: parseFloat(price),
                    image: imageUrl,
                    createdAt: serverTimestamp()
                });

                status.innerText = "✅ המוצר נוסף בהצלחה!";
                
                // איפוס טופס
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
                fileInput.value = '';

                setTimeout(() => status.classList.add('hidden'), 3000);

            } catch (error) {
                console.error("Error adding product:", error);
                alert("שגיאה בתהליך: " + error.message);
                status.innerText = "❌ תקלה: " + error.message;
            } finally {
                btn.disabled = false;
            }
        };

        // משיכת מוצרים בזמן אמת
        try {
            const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const grid = document.getElementById('productsGrid');
                grid.innerHTML = '';
                snapshot.forEach((doc) => {
                    const item = doc.data();
                    grid.innerHTML += `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <img src="${item.image}" class="w-full h-32 object-contain bg-gray-50 p-2" onerror="this.src='https://via.placeholder.com/150?text=Error'">
                            <div class="p-3 text-center">
                                <h3 class="font-bold text-gray-800 truncate text-sm">${item.name}</h3>
                                <p class="text-blue-600 font-bold">₪${item.price}</p>
                            </div>
                        </div>
                    `;
                });
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                if (error.code === 'permission-denied') {
                    alert("שגיאה: אין הרשאות קריאה ב-Firebase. בדוק את ה-Rules!");
                }
            });
        } catch (e) {
            console.error("Setup Error:", e);
        }
    </script>
</body>
</html>
