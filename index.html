<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Premium - Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;600;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background-color: #0a0a0a; /* שחור עמוק */
            color: #e2e8f0;
            margin: 0;
        }

        .premium-card {
            background: #171717; /* אפור גרפיט */
            border: 1px solid #262626;
            transition: all 0.3s ease;
        }

        .premium-card:hover {
            border-color: #a3e635; /* נגיעה של ירוק ליים/זהב בבחירה */
            transform: translateY(-4px);
        }

        .gold-text {
            color: #fbbf24; /* זהב מאופק */
        }

        .category-btn {
            background: #171717;
            color: #737373;
            border: 1px solid #262626;
            transition: all 0.2s;
        }

        .category-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 800;
        }

        .admin-panel {
            background: #111111;
            border-bottom: 2px solid #262626;
        }

        /* הסתרת פס גלילה */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="p-5 border-b border-neutral-800 bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-light tracking-widest uppercase">Kiosk <span class="font-extrabold gold-text">Premium</span></h1>
            <button onclick="toggleAdmin()" id="toggleBtn" class="text-[10px] uppercase tracking-tighter border border-neutral-700 px-4 py-2 rounded-sm hover:bg-white hover:text-black transition-all">
                Admin Console
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto p-4">
        
        <div id="adminPanel" class="hidden mb-10 p-6 premium-card rounded-lg animate-in slide-in-from-top duration-500">
            <h2 class="text-sm uppercase tracking-widest mb-6 gold-text">הוספת פריט חדש</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="itemName" placeholder="שם המוצר" class="bg-neutral-900 border border-neutral-800 p-3 rounded text-sm outline-none focus:border-neutral-500">
                <input type="number" id="itemPrice" placeholder="מחיר" class="bg-neutral-900 border border-neutral-800 p-3 rounded text-sm outline-none focus:border-neutral-500">
                <select id="itemCategory" class="bg-neutral-900 border border-neutral-800 p-3 rounded text-sm outline-none">
                    <option value="שתייה">שתייה</option>
                    <option value="חטיפים">חטיפים</option>
                    <option value="סיגריות">סיגריות</option>
                    <option value="אחר">אחר</option>
                </select>
                <input type="file" id="itemFile" class="text-[10px] text-neutral-500 pt-2">
            </div>
            <button onclick="addProduct()" id="addBtn" class="mt-6 bg-white text-black text-xs font-bold uppercase tracking-widest px-8 py-3 rounded hover:bg-neutral-200 transition-all">
                אישור והעלאה
            </button>
            <div id="status" class="mt-4 text-xs gold-text hidden"></div>
        </div>

        <nav class="flex overflow-x-auto gap-2 mb-8 no-scrollbar">
            <button onclick="filterItems('הכל')" class="category-btn active px-8 py-2 rounded-full text-xs uppercase tracking-widest">הכל</button>
            <button onclick="filterItems('שתייה')" class="category-btn px-8 py-2 rounded-full text-xs uppercase tracking-widest">שתייה</button>
            <button onclick="filterItems('חטיפים')" class="category-btn px-8 py-2 rounded-full text-xs uppercase tracking-widest">חטיפים</button>
            <button onclick="filterItems('סיגריות')" class="category-btn px-8 py-2 rounded-full text-xs uppercase tracking-widest">סיגריות</button>
        </nav>

        <div id="productsGrid" class="grid grid-cols-3 gap-3 md:gap-6">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let currentFilter = 'הכל';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            return data.data.url;
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            const status = document.getElementById('status');
            if (!name || !price || !file) return alert("חסרים פרטים");

            try {
                status.innerText = "מעבד..."; status.classList.remove('hidden');
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), category, image: imageUrl, createdAt: serverTimestamp() });
                status.innerText = "הפריט עלה למערכת";
                setTimeout(() => status.classList.add('hidden'), 2000);
            } catch (e) { alert(e.message); }
        };

        window.deleteItem = async (id) => {
            if (confirm("מחיקה?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("עדכן מחיר:", oldPrice);
            if (newPrice) await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
        };

        window.filterItems = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === cat);
            });
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                if (currentFilter !== 'הכל' && item.category !== currentFilter) return;

                grid.innerHTML += `
                    <div class="premium-card rounded-lg overflow-hidden flex flex-col h-full">
                        <div class="h-24 md:h-40 bg-white/5 flex items-center justify-center p-2">
                            <img src="${item.image}" class="max-w-full max-h-full object-contain brightness-90">
                        </div>
                        <div class="p-3 flex flex-col flex-grow text-center">
                            <h3 class="text-[10px] md:text-sm font-light uppercase tracking-tighter mb-1 truncate">${item.name}</h3>
                            <p class="gold-text font-bold text-sm md:text-lg">₪${item.price}</p>
                            ${isAdmin ? `
                                <div class="flex gap-2 mt-3 justify-center">
                                    <button onclick="updatePrice('${doc.id}', ${item.price})" class="text-neutral-500 hover:text-white transition-colors text-[10px]"><i class="fa-solid fa-edit"></i></button>
                                    <button onclick="deleteItem('${doc.id}')" class="text-neutral-500 hover:text-red-500 transition-colors text-[10px]"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
