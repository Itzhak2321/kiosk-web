<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול קיוסק מקצועי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #f8fafc; }
        .category-tab.active { background-color: #3b82f6; color: white; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-6xl mx-auto p-4">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800">Kiosk <span class="text-blue-600">Pro</span></h1>
            </div>
            <button onclick="toggleAdmin()" id="toggleBtn" class="bg-slate-800 text-white px-6 py-2 rounded-xl font-bold hover:bg-slate-700 transition">
                מצב ניהול <i class="fa-solid fa-lock ml-2"></i>
            </button>
        </header>

        <div id="adminPanel" class="hidden bg-white p-8 rounded-2xl shadow-md border border-blue-50 mb-10">
            <h2 class="text-2xl font-bold mb-6 text-slate-800 border-r-4 border-blue-600 pr-3">הוספת מוצר חדש</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="itemName" placeholder="שם המוצר" class="border p-3 rounded-xl w-full focus:ring-2 focus:ring-blue-500">
                <input type="number" id="itemPrice" placeholder="מחיר ב-₪" class="border p-3 rounded-xl w-full focus:ring-2 focus:ring-blue-500">
                <select id="itemCategory" class="border p-3 rounded-xl w-full focus:ring-2 focus:ring-blue-500">
                    <option value="שתייה">שתייה</option>
                    <option value="חטיפים">חטיפים</option>
                    <option value="מאפים">מאפים</option>
                    <option value="אחר">אחר</option>
                </select>
                <input type="file" id="itemFile" accept="image/*" class="border p-2 rounded-xl w-full bg-slate-50 text-sm">
            </div>
            <button onclick="addProduct()" id="addBtn" class="mt-6 bg-blue-600 text-white font-bold px-10 py-3 rounded-xl hover:bg-blue-700 w-full md:w-auto shadow-lg shadow-blue-200 transition">
                הוסף מוצר <i class="fa-solid fa-plus mr-2"></i>
            </button>
            <div id="status" class="mt-4 text-center font-bold text-blue-600 hidden"></div>
        </div>

        <nav class="flex flex-wrap gap-3 mb-8 justify-center">
            <button onclick="filterItems('הכל')" class="category-tab active px-6 py-2 rounded-full border border-blue-200 font-bold hover:shadow-md transition">הכל</button>
            <button onclick="filterItems('שתייה')" class="category-tab px-6 py-2 rounded-full border border-blue-200 font-bold hover:shadow-md transition">שתייה</button>
            <button onclick="filterItems('חטיפים')" class="category-tab px-6 py-2 rounded-full border border-blue-200 font-bold hover:shadow-md transition">חטיפים</button>
            <button onclick="filterItems('מאפים')" class="category-tab px-6 py-2 rounded-full border border-blue-200 font-bold hover:shadow-md transition">מאפים</button>
        </nav>

        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // הגדרות Firebase - הדבק את ה-Config שלך כאן
        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let currentFilter = 'הכל';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            document.getElementById('toggleBtn').innerHTML = isAdmin ? 'מצב תצוגה <i class="fa-solid fa-eye ml-2"></i>' : 'מצב ניהול <i class="fa-solid fa-lock ml-2"></i>';
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            if (data.success) return data.data.url;
            throw new Error("נכשל בהעלאת תמונה");
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            const status = document.getElementById('status');

            if (!name || !price || !file) return alert("מלא את כל הפרטים!");

            try {
                status.innerText = "מעלה..."; status.classList.remove('hidden');
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), category, image: imageUrl, createdAt: serverTimestamp() });
                status.innerText = "הצלחנו!";
                document.getElementById('itemName').value = ''; document.getElementById('itemPrice').value = '';
                setTimeout(() => status.classList.add('hidden'), 2000);
            } catch (e) { alert(e.message); }
        };

        window.deleteItem = async (id) => {
            if (confirm("בטוח שרוצה למחוק?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id) => {
            const newPrice = prompt("הזן מחיר חדש:");
            if (newPrice) await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
        };

        window.filterItems = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.category-tab').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText === cat) btn.classList.add('active');
            });
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            snapshot.forEach((doc) => {
                const item = doc.data();
                if (currentFilter !== 'הכל' && item.category !== currentFilter) return;

                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden relative group">
                        <img src="${item.image}" class="w-full h-40 object-contain bg-slate-50 p-4 transition group-hover:scale-105">
                        <div class="p-4 text-center">
                            <span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-bold">${item.category}</span>
                            <h3 class="font-bold text-slate-800 mt-1 truncate">${item.name}</h3>
                            <p class="text-blue-600 font-extrabold text-xl">₪${item.price}</p>
                            ${isAdmin ? `
                                <div class="mt-3 flex gap-2 justify-center">
                                    <button onclick="updatePrice('${doc.id}')" class="bg-blue-100 text-blue-700 p-2 rounded-lg text-xs font-bold hover:bg-blue-200"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteItem('${doc.id}')" class="bg-red-100 text-red-700 p-2 rounded-lg text-xs font-bold hover:bg-red-200"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
