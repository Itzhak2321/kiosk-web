<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחירון קיוסק</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            margin: 0;
            min-h-screen;
        }

        /* הגדרת כרטיס המוצר עם תאורת אווירה */
        .product-card {
            background: #1e293b;
            border-radius: 1.25rem;
            position: relative; /* חובה בשביל המסגרת */
            overflow: hidden; /* מונע מהתאורה לצאת */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* הגדרת תאורת אווירה (Ambient Light Border) */
        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 1.25rem;
            padding: 2.5px; /* עובי המסגרת */
            background: linear-gradient(135deg, #3b82f6 0%, #a855f7 33%, #ef4444 66%, #22c55e 100%);
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.8; /* עוצמת התאורה */
        }

        /* הוספת ה"בוהק" (Glow Effect) */
        .product-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 1.25rem;
            box-shadow: 
                0 0 10px rgba(59, 130, 246, 0.2), 
                0 0 20px rgba(168, 53, 247, 0.2), 
                0 0 30px rgba(239, 68, 68, 0.2);
            opacity: 0.6;
        }

        /* אפקט בחירה */
        .product-card:active {
            transform: scale(0.96);
            background: #334155;
        }

        .img-box {
            width: 100%;
            height: 180px;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1; /* מוודא שהתמונה מעל התאורה */
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* מוודא שהטקסט מעל התאורה */
        .card-content {
            position: relative;
            z-index: 1;
        }

        .admin-fab {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: #ffffff;
            color: #000;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
            cursor: pointer;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="p-8 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight">מחירון <span class="text-blue-500">קיוסק</span></h1>
    </header>

    <div class="max-w-2xl mx-auto px-4">
        
        <div id="adminPanel" class="hidden mb-8 p-6 bg-slate-800/80 backdrop-blur-md rounded-3xl border border-white/10 relative z-50">
            <h2 class="text-lg font-bold mb-4">מוצר חדש</h2>
            <div class="grid gap-3">
                <input type="text" id="itemName" placeholder="שם המוצר" class="w-full p-3 rounded-xl bg-slate-900 border-none text-white outline-none">
                <input type="number" id="itemPrice" placeholder="מחיר" class="w-full p-3 rounded-xl bg-slate-900 border-none text-white outline-none">
                <select id="itemCategory" class="w-full p-3 rounded-xl bg-slate-900 border-none text-white outline-none">
                    <option value="שתייה">שתייה</option>
                    <option value="חטיפים">חטיפים</option>
                    <option value="סיגריות">סיגריות</option>
                    <option value="אחר">אחר</option>
                </select>
                <input type="file" id="itemFile" class="text-xs text-slate-400 p-2">
                <button onclick="addProduct()" class="bg-blue-600 text-white font-bold py-3 rounded-xl">שמור למחירון</button>
            </div>
        </div>

        <div class="mb-6">
            <input type="text" id="searchInput" oninput="searchProducts()" placeholder="חיפוש מהיר..." class="w-full p-4 rounded-2xl bg-slate-800 border-none text-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>

        <div id="productsGrid" class="grid grid-cols-2 gap-6 pb-12">
            </div>
    </div>

    <div class="admin-fab" onclick="toggleAdmin()">
        <i id="adminIcon" class="fa-solid fa-pen-nib"></i>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let searchQuery = '';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            document.getElementById('adminIcon').className = isAdmin ? 'fa-solid fa-xmark' : 'fa-solid fa-pen-nib';
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            return data.data.url;
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            if (!name || !price || !file) return alert("חסרים פרטים");

            try {
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), category, image: imageUrl, createdAt: serverTimestamp() });
                location.reload();
            } catch (e) { alert(e.message); }
        };

        window.deleteItem = async (id) => {
            if (confirm("למחוק?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("עדכן מחיר:", oldPrice);
            if (newPrice) await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
        };

        window.searchProducts = () => {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                if (item.name.toLowerCase().includes(searchQuery)) {
                    grid.innerHTML += `
                        <div class="product-card">
                            <div class="img-box rounded-t-[1.25rem]">
                                <img src="${item.image}" class="rounded-t-[1.25rem]">
                            </div>
                            <div class="card-content p-4 text-center">
                                <h3 class="text-lg font-semibold truncate">${item.name}</h3>
                                <div class="text-2xl font-extrabold mt-1 text-white">₪${item.price}</div>
                                ${isAdmin ? `
                                    <div class="flex gap-2 justify-center mt-3 border-t border-white/5 pt-3">
                                        <button onclick="updatePrice('${doc.id}', ${item.price})" class="text-blue-400 text-sm p-1 hover:text-white"><i class="fa-solid fa-edit"></i></button>
                                        <button onclick="deleteItem('${doc.id}')" class="text-red-400 text-sm p-1 hover:text-white"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
