<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מוצרי קיוסק</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-5xl mx-auto p-4">
        <header class="text-center py-8">
            <h1 class="text-4xl font-extrabold text-blue-900 mb-2">ניהול קטלוג קיוסק</h1>
            <p class="text-gray-600">הוספת מוצרים ועדכון מחירים בזמן אמת</p>
        </header>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-10">
            <h2 class="text-xl font-bold mb-4 text-gray-800">הוספת מוצר חדש</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">שם המוצר</label>
                    <input type="text" id="itemName" placeholder="לדוגמה: קולה זירו" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">מחיר (₪)</label>
                    <input type="number" id="itemPrice" placeholder="0.00" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">קישור לתמונה</label>
                    <input type="text" id="itemImageUrl" placeholder="הדבק כאן לינק לתמונה" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>
            <button onclick="addProduct()" id="addBtn" class="mt-6 bg-blue-600 text-white font-bold px-8 py-3 rounded-lg hover:bg-blue-700 transition w-full md:w-auto shadow-md shadow-blue-200">
                פרסם מוצר באתר
            </button>
            <p id="status" class="mt-3 text-sm font-medium text-blue-600 hidden">שומר נתונים...</p>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">המוצרים באתר</h2>
            <span id="productCount" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0 מוצרים</span>
        </div>
        
        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // החלף את הפרטים הבאים מה-Firebase Console שלך
        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
  authDomain: "kiosk-web-55899.firebaseapp.com",
  databaseURL: "https://kiosk-web-55899-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kiosk-web-55899",
  storageBucket: "kiosk-web-55899.firebasestorage.app",
  messagingSenderId: "593665505846",
  appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // פונקציה להוספת מוצר
        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const url = document.getElementById('itemImageUrl').value;
            const status = document.getElementById('status');

            if (!name || !price || !url) {
                alert("חובה למלא שם, מחיר ולינק לתמונה");
                return;
            }

            try {
                status.classList.remove('hidden');
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: parseFloat(price),
                    image: url,
                    createdAt: serverTimestamp()
                });

                // איפוס שדות
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
                document.getElementById('itemImageUrl').value = '';
                status.classList.add('hidden');
            } catch (e) {
                console.error(e);
                alert("שגיאה בשמירה: " + e.message);
                status.classList.add('hidden');
            }
        };

        // משיכת נתונים והצגה בזמן אמת
        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const grid = document.getElementById('productsGrid');
            const countLabel = document.getElementById('productCount');
            grid.innerHTML = '';
            
            countLabel.innerText = `${snapshot.size} מוצרים`;

            snapshot.forEach((doc) => {
                const item = doc.data();
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden product-card">
                        <div class="h-40 bg-gray-100 flex items-center justify-center overflow-hidden">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        </div>
                        <div class="p-4 text-center">
                            <h3 class="text-lg font-bold text-gray-800 truncate">${item.name}</h3>
                            <p class="text-blue-600 font-extrabold text-xl mt-1">₪${item.price}</p>
                        </div>
                    </div>
                `;
            });

            if (snapshot.empty) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-400 py-10">אין מוצרים בקטלוג. הוסף את המוצר הראשון למעלה!</p>';
            }
        });
    </script>
</body>
</html>
