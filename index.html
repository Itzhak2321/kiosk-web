<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Pro - ניהול חכם</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            background-attachment: fixed;
        }

        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .category-tab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-tab.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transform: translateY(-2px);
        }

        .product-card {
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }

        .admin-gradient {
            background: linear-gradient(to right, #1e293b, #334155);
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-6xl mx-auto p-4 md:p-6">
        <header class="flex justify-between items-center mb-8 glass p-5 rounded-3xl shadow-sm">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-xl text-white">
                    <i class="fa-solid fa-shop text-xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">קיוסק <span class="text-blue-600">יצחק</span></h1>
            </div>
            <button onclick="toggleAdmin()" id="toggleBtn" class="bg-slate-800 text-white px-5 py-2 rounded-2xl font-bold hover:bg-blue-600 transition-all flex items-center gap-2 text-sm shadow-md">
                <span>מצב ניהול</span> <i class="fa-solid fa-user-gear"></i>
            </button>
        </header>

        <div id="adminPanel" class="hidden glass p-6 md:p-8 rounded-3xl shadow-xl mb-10 border-t-4 border-blue-600 animate-in fade-in duration-500">
            <div class="flex items-center gap-3 mb-6">
                <i class="fa-solid fa-plus-circle text-blue-600 text-2xl"></i>
                <h2 class="text-xl font-bold text-slate-800">הוספת מוצר חדש</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 mr-2">שם המוצר</label>
                    <input type="text" id="itemName" placeholder="לדוגמה: מרלבורו אדום" class="w-full p-3 rounded-2xl border-none bg-slate-100 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 mr-2">מחיר</label>
                    <input type="number" id="itemPrice" placeholder="₪" class="w-full p-3 rounded-2xl border-none bg-slate-100 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 mr-2">קטגוריה</label>
                    <select id="itemCategory" class="w-full p-3 rounded-2xl border-none bg-slate-100 focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-slate-600">
                        <option value="שתייה">🥤 שתייה</option>
                        <option value="חטיפים">🍿 חטיפים</option>
                        <option value="סיגריות">🚬 סיגריות</option>
                        <option value="אחר">📦 אחר</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 mr-2">תמונה</label>
                    <input type="file" id="itemFile" accept="image/*" class="w-full p-2 rounded-2xl border-none bg-slate-100 text-xs cursor-pointer">
                </div>
            </div>
            <button onclick="addProduct()" id="addBtn" class="mt-6 bg-blue-600 text-white font-bold px-10 py-3.5 rounded-2xl hover:bg-blue-700 w-full md:w-auto shadow-lg shadow-blue-200 transition-all active:scale-95">
                פרסם מוצר באתר <i class="fa-solid fa-paper-plane mr-2"></i>
            </button>
            <div id="status" class="mt-4 text-center font-bold text-blue-600 hidden animate-pulse"></div>
        </div>

        <nav class="flex flex-wrap gap-2 mb-10 justify-center">
            <button onclick="filterItems('הכל')" class="category-tab active px-8 py-2.5 rounded-2xl border border-white bg-white text-slate-600 font-bold shadow-sm">הכל</button>
            <button onclick="filterItems('שתייה')" class="category-tab px-8 py-2.5 rounded-2xl border border-white bg-white text-slate-600 font-bold shadow-sm">שתייה</button>
            <button onclick="filterItems('חטיפים')" class="category-tab px-8 py-2.5 rounded-2xl border border-white bg-white text-slate-600 font-bold shadow-sm">חטיפים</button>
            <button onclick="filterItems('סיגריות')" class="category-tab px-8 py-2.5 rounded-2xl border border-white bg-white text-slate-600 font-bold shadow-sm">סיגריות</button>
        </nav>

        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let currentFilter = 'הכל';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            document.getElementById('toggleBtn').innerHTML = isAdmin ? 'מצב תצוגה <i class="fa-solid fa-eye ml-2"></i>' : 'מצב ניהול <i class="fa-solid fa-user-gear ml-2"></i>';
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            if (data.success) return data.data.url;
            throw new Error("נכשל בהעלאת תמונה");
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            const status = document.getElementById('status');

            if (!name || !price || !file) return alert("מלא את כל הפרטים!");

            try {
                document.getElementById('addBtn').disabled = true;
                status.innerText = "⏳ מעלה את המוצר לענן..."; 
                status.classList.remove('hidden');
                
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), category, image: imageUrl, createdAt: serverTimestamp() });
                
                status.innerText = "✅ המוצר עלה בהצלחה!";
                document.getElementById('itemName').value = ''; 
                document.getElementById('itemPrice').value = '';
                document.getElementById('itemFile').value = '';
                setTimeout(() => status.classList.add('hidden'), 3000);
            } catch (e) { alert("שגיאה: " + e.message); }
            finally { document.getElementById('addBtn').disabled = false; }
        };

        window.deleteItem = async (id) => {
            if (confirm("האם אתה בטוח שברצונך למחוק מוצר זה?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("הזן מחיר חדש למוצר:", oldPrice);
            if (newPrice && !isNaN(newPrice)) {
                await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
            }
        };

        window.filterItems = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.category-tab').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === cat);
            });
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                if (currentFilter !== 'הכל' && item.category !== currentFilter) return;

                grid.innerHTML += `
                    <div class="product-card glass rounded-3xl overflow-hidden shadow-sm flex flex-col h-full border border-white">
                        <div class="h-40 bg-white/50 flex items-center justify-center p-4 relative">
                            <img src="${item.image}" class="max-w-full max-h-full object-contain">
                            <span class="absolute top-3 right-3 text-[10px] bg-white/80 backdrop-blur px-2 py-1 rounded-lg font-extrabold text-slate-500 shadow-sm">${item.category}</span>
                        </div>
                        <div class="p-4 flex flex-col flex-grow">
                            <h3 class="font-bold text-slate-800 text-base mb-1 truncate">${item.name}</h3>
                            <div class="mt-auto flex items-center justify-between">
                                <p class="text-blue-600 font-black text-xl">₪${item.price}</p>
                                ${isAdmin ? `
                                    <div class="flex gap-1">
                                        <button onclick="updatePrice('${doc.id}', ${item.price})" class="bg-blue-50 text-blue-600 w-8 h-8 rounded-xl flex items-center justify-center hover:bg-blue-600 hover:text-white transition-colors"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                        <button onclick="deleteItem('${doc.id}')" class="bg-red-50 text-red-500 w-8 h-8 rounded-xl flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            if (grid.innerHTML === '') {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-bold">אין מוצרים להצגה בקטגוריה זו</div>`;
            }
        }
    </script>
</body>
</html>
