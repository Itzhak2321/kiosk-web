<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קיוסק פרימיום - ניהול ומכירה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;600;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background-color: #0a0a0a; 
            color: #e2e8f0;
            margin: 0;
            overflow-x: hidden;
        }

        .premium-card {
            background: #171717; 
            border: 1px solid #262626;
            transition: all 0.3s ease;
        }

        .premium-card:hover {
            border-color: #fbbf24; 
            transform: translateY(-4px);
        }

        .gold-text { color: #fbbf24; }
        .gold-bg { background-color: #fbbf24; }

        .category-btn {
            background: #171717;
            color: #737373;
            border: 1px solid #262626;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .category-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 800;
        }

        input, select {
            background: #111111 !important;
            border: 1px solid #262626 !important;
            color: white !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* אנימציית טעינה */
        .loader {
            border: 2px solid #262626;
            border-top: 2px solid #fbbf24;
            border-radius: 50%;
            width: 15px;
            height: 15px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="p-4 border-b border-neutral-800 bg-black/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-light tracking-widest">קיוסק <span class="font-extrabold gold-text">יוקרה</span></h1>
            <button onclick="toggleAdmin()" id="toggleBtn" class="text-[10px] font-bold border border-neutral-700 px-4 py-2 rounded hover:bg-white hover:text-black transition-all">
                מרכז ניהול <i class="fa-solid fa-gears mr-1"></i>
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto p-4">
        
        <div id="adminPanel" class="hidden mb-8 p-6 premium-card rounded-xl animate-in slide-in-from-top duration-500">
            <h2 class="text-xs uppercase tracking-widest mb-6 gold-text font-bold">הוספת פריט חדש למלאי</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="itemName" placeholder="שם המוצר (למשל: וינסטון לייט)" class="p-3 rounded text-sm outline-none">
                <input type="number" id="itemPrice" placeholder="מחיר ב-₪" class="p-3 rounded text-sm outline-none">
                <select id="itemCategory" class="p-3 rounded text-sm outline-none font-bold">
                    <option value="שתייה">🥤 שתייה</option>
                    <option value="חטיפים">🍿 חטיפים</option>
                    <option value="סיגריות">🚬 סיגריות</option>
                    <option value="אחר">📦 אחר</option>
                </select>
                <div class="flex items-center bg-neutral-900 border border-neutral-800 p-2 rounded">
                    <input type="file" id="itemFile" class="text-[10px] text-neutral-500 w-full cursor-pointer">
                </div>
            </div>
            <button onclick="addProduct()" id="addBtn" class="mt-6 bg-white text-black text-xs font-bold px-8 py-3 rounded hover:bg-neutral-200 transition-all flex items-center justify-center">
                <span id="btnText">אישור ופרסום מוצר</span>
                <div id="btnLoader" class="loader hidden"></div>
            </button>
            <div id="status" class="mt-4 text-xs gold-text hidden"></div>
        </div>

        <div class="mb-8 space-y-4">
            <div class="relative max-w-md mx-auto">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-neutral-500 text-sm"></i>
                <input type="text" id="searchInput" oninput="searchProducts()" placeholder="חפש מוצר..." class="w-full pr-10 pl-4 py-3 rounded-full bg-neutral-900 border border-neutral-800 text-sm outline-none focus:border-neutral-600 transition-all">
            </div>
            
            <nav class="flex overflow-x-auto gap-2 no-scrollbar pb-2">
                <button onclick="filterItems('הכל')" class="category-btn active px-8 py-2 rounded-full text-xs font-bold">הכל</button>
                <button onclick="filterItems('שתייה')" class="category-btn px-8 py-2 rounded-full text-xs font-bold">שתייה</button>
                <button onclick="filterItems('חטיפים')" class="category-btn px-8 py-2 rounded-full text-xs font-bold">חטיפים</button>
                <button onclick="filterItems('סיגריות')" class="category-btn px-8 py-2 rounded-full text-xs font-bold">סיגריות</button>
            </nav>
        </div>

        <div id="productsGrid" class="grid grid-cols-3 gap-3 md:gap-6">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let currentFilter = 'הכל';
        let searchQuery = '';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            return data.data.url;
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            const btn = document.getElementById('addBtn');
            const loader = document.getElementById('btnLoader');
            
            if (!name || !price || !file) return alert("אנא מלא את כל השדות וצרף תמונה");

            try {
                btn.disabled = true; loader.classList.remove('hidden');
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), category, image: imageUrl, createdAt: serverTimestamp() });
                
                alert("המוצר נוסף בהצלחה!");
                document.getElementById('itemName').value = ''; 
                document.getElementById('itemPrice').value = '';
                document.getElementById('itemFile').value = '';
            } catch (e) { alert("שגיאה בהעלאה: " + e.message); }
            finally { btn.disabled = false; loader.classList.add('hidden'); }
        };

        window.deleteItem = async (id) => {
            if (confirm("להסיר את המוצר מהמערכת?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("הזן מחיר חדש ב-₪:", oldPrice);
            if (newPrice) await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
        };

        window.filterItems = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'הכל' && btn.innerText === 'הכל'));
            });
            renderProducts(window.lastSnapshot);
        };

        window.searchProducts = () => {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                const matchesFilter = currentFilter === 'הכל' || item.category === currentFilter;
                const matchesSearch = item.name.toLowerCase().includes(searchQuery);

                if (matchesFilter && matchesSearch) {
                    grid.innerHTML += `
                        <div class="premium-card rounded-xl overflow-hidden flex flex-col h-full shadow-lg">
                            <div class="h-24 md:h-44 bg-white/5 flex items-center justify-center p-2 relative">
                                <img src="${item.image}" class="max-w-full max-h-full object-contain">
                            </div>
                            <div class="p-2 md:p-4 flex flex-col flex-grow text-center">
                                <h3 class="text-[10px] md:text-sm font-semibold mb-1 truncate">${item.name}</h3>
                                <p class="gold-text font-black text-sm md:text-xl">₪${item.price}</p>
                                ${isAdmin ? `
                                    <div class="flex gap-3 mt-3 justify-center border-t border-neutral-800 pt-3">
                                        <button onclick="updatePrice('${doc.id}', ${item.price})" class="text-neutral-400 hover:text-white transition-colors text-xs"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button onclick="deleteItem('${doc.id}')" class="text-neutral-400 hover:text-red-500 transition-colors text-xs"><i class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
