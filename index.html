<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול קיוסק</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-card { transition: transform 0.2s; }
        .product-card:hover { transform: scale(1.02); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-800">מערכת ניהול קיוסק</h1>

        <!-- טופס הוספת מוצר (ממשק ניהול) -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-10">
            <h2 class="text-xl font-semibold mb-4">הוספת מוצר חדש</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="itemName" placeholder="שם המוצר" class="border p-2 rounded">
                <input type="number" id="itemPrice" placeholder="מחיר" class="border p-2 rounded">
                <input type="file" id="itemImage" accept="image/*" class="border p-2 rounded">
            </div>
            <button onclick="uploadProduct()" id="uploadBtn" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 w-full md:w-auto">
                העלה מוצר
            </button>
            <div id="status" class="mt-2 text-sm text-gray-600"></div>
        </div>

        <hr class="mb-10">

        <!-- תצוגת המוצרים -->
        <h2 class="text-2xl font-bold mb-6 text-gray-700">התפריט שלנו</h2>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- כאן יופיעו המוצרים מהדאטה-בייס -->
            <p class="text-gray-500">טוען מוצרים...</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // TODO: החלף בפרטי הפרויקט שלך מ-Firebase Console
        const firebaseConfig = {
            // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
  authDomain: "kiosk-web-55899.firebaseapp.com",
  projectId: "kiosk-web-55899",
  storageBucket: "kiosk-web-55899.firebasestorage.app",
  messagingSenderId: "593665505846",
  appId: "1:593665505846:web:df4c0982776560e4803697"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
        };

        // אתחול
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // פונקציה להעלאת מוצר
        window.uploadProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const file = document.getElementById('itemImage').files[0];
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('status');

            if (!name || !price || !file) {
                alert("נא למלא את כל השדות ולבחור תמונה");
                return;
            }

            try {
                btn.disabled = true;
                status.innerText = "מעלה תמונה...";

                // 1. העלאת תמונה ל-Storage
                const storageRef = ref(storage, `products/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(snapshot.ref);

                status.innerText = "שומר נתונים...";

                // 2. שמירת המידע ב-Firestore
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: parseFloat(price),
                    image: downloadURL,
                    createdAt: new Date()
                });

                status.innerText = "המוצר נוסף בהצלחה!";
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
                document.getElementById('itemImage').value = '';
            } catch (error) {
                console.error(error);
                alert("שגיאה בהעלאה: " + error.message);
            } finally {
                btn.disabled = false;
            }
        };

        // פונקציה למשיכת מוצרים והצגתם בזמן אמת
        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-lg overflow-hidden product-card">
                        <img src="${item.image}" class="w-full h-48 object-cover" alt="${item.name}">
                        <div class="p-4">
                            <h3 class="text-xl font-bold text-gray-800">${item.name}</h3>
                            <p class="text-blue-600 font-bold text-lg mt-2">₪${item.price}</p>
                        </div>
                    </div>
                `;
            });

            if (snapshot.empty) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500">אין מוצרים להצגה.</p>';
            }
        });
    </script>
</body>
</html>
