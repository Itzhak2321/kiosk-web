<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחירון קיוסק דינמי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            min-h-screen;
        }

        /* 1. כרטיס ראשי (RGB Frame) */
        .product-card {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 1.5rem;
            padding: 3px;
            overflow: hidden;
            display: flex;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 2. אנימציית סיבוב מסגרת (RGB Rotating Background) */
        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                #3b82f6, #a855f7, #ef4444, #22c55e, #3b82f6
            );
            animation: rotateRGB 4s linear infinite;
        }

        /* 3. תוכן פנימי (Card Inner) */
        .card-inner {
            position: relative;
            flex: 1;
            background: #1e293b;
            border-radius: 1.35rem;
            z-index: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        /* 4. חיווי "פעמת" על לחיצה (Tap Pulse) */
        .product-card.tap-pulse::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 1.5rem;
            box-shadow: 0 0 0 10px rgba(59, 130, 246, 0.5);
            opacity: 0;
            z-index: 2;
            animation: tapPulse 0.4s ease-out;
        }

        /* 5. כפתור "הנחה" זוהר (Sale Button Glow) */
        .sale-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #fbbf24; /* צבע זהב */
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            font-weight: 800;
            font-size: 10px;
            box-shadow: 0 0 10px #fbbf24;
            z-index: 5;
            transition: all 0.2s ease;
            cursor: pointer;
            animation: saleGlow 2s ease-in-out infinite alternate;
        }

        /* 6. אנימציות */
        @keyframes rotateRGB {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes tapPulse {
            0% { opacity: 1; box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.7); }
            100% { opacity: 0; box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
        }

        @keyframes saleGlow {
            0% { box-shadow: 0 0 5px #fbbf24; opacity: 0.8; }
            100% { box-shadow: 0 0 15px #fbbf24; opacity: 1; }
        }

        /* שאר העיצובים נשמרו */
        .img-box {
            width: 100%; height: 180px; background: white;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .img-box img { max-width: 85%; max-height: 85%; object-fit: contain; }
        .admin-fab {
            position: fixed; bottom: 25px; left: 25px; background: #ffffff; color: #000;
            width: 56px; height: 56px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.3); z-index: 1000;
        }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight">מחירון <span class="text-blue-500 font-light">קיוסק</span></h1>
    </header>

    <div class="max-w-2xl mx-auto px-4">
        <div id="adminPanel" class="hidden mb-8 p-6 bg-slate-800/90 backdrop-blur-md rounded-3xl border border-white/10 z-50 relative space-y-3">
            <input type="text" id="itemName" placeholder="שם המוצר" class="w-full p-3 rounded-xl bg-slate-900 text-white outline-none">
            <input type="number" id="itemPrice" placeholder="מחיר" class="w-full p-3 rounded-xl bg-slate-900 text-white outline-none">
            <input type="file" id="itemFile" class="text-xs text-slate-400 p-2 w-full">
            <button onclick="addProduct()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">הוסף למחירון</button>
        </div>

        <div id="productsGrid" class="grid grid-cols-2 gap-5">
            </div>
    </div>

    <div class="admin-fab" onclick="toggleAdmin()">
        <i class="fa-solid fa-pen-nib"></i>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            return data.data.url;
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const file = document.getElementById('itemFile').files[0];
            if (!name || !price || !file) return alert("מלא פרטים");
            try {
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), image: imageUrl, isSale: false, createdAt: serverTimestamp() });
                location.reload();
            } catch (e) { alert(e.message); }
        };

        // --- פונקציות הנחה (Sale) חדשות ---
        window.toggleSale = async (id, currentStatus) => {
            await updateDoc(doc(db, "products", id), { isSale: !currentStatus });
        };

        window.triggerPulse = (cardId) => {
            const card = document.getElementById(cardId);
            card.classList.add('tap-pulse');
            setTimeout(() => card.classList.remove('tap-pulse'), 400); // הסרה אחרי סיום האנימציה
        };

        window.deleteItem = async (id) => {
            if (confirm("למחוק?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("מחיר חדש:", oldPrice);
            if (newPrice) await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                const cardId = `card_${doc.id}`;
                
                grid.innerHTML += `
                    <div class="product-card shadow-2xl" id="${cardId}">
                        ${isAdmin ? `
                            <div class="sale-badge" onclick="triggerPulse('${cardId}'); toggleSale('${doc.id}', ${item.isSale})" title="סמן במבצע">
                                ${item.isSale ? '<i class="fa-solid fa-star"></i>' : '₪'}
                            </div>
                        ` : (item.isSale ? `<div class="sale-badge"><i class="fa-solid fa-fire"></i></div>` : '')}
                        
                        <div class="card-inner">
                            <div class="img-box">
                                <img src="${item.image}">
                            </div>
                            <div class="p-4 text-center flex flex-col justify-center flex-grow">
                                <h3 class="text-xs font-bold truncate text-slate-400 mb-1 ${item.isSale ? 'accent-color' : ''}">${item.name}מעבר למסגרת המסתובבת שכבר עשינו, הנה התוספת שביקשת שתהפוך את הממשק לדינמי וחווייתי הרבה יותר, ממש כמו התאורה הלילית בקיוסק:

**פעימת הנחה זוהרת (Haptic Glow Badge)**.

זה לא סתם כפתור; במצב ניהול, תוכל בלחיצה אחת לסמן מוצר כ"מבצע".
1.  **ויזואלי:** הכרטיס מקבל באדג' זהוב, עגול ובוהק בפינה, ש**דועך ונדלק (saleGlow)** כמו אור נשימה.
2.  **תחישתי:** כשלוחצים עליו כדי להפעיל/לכבות את המבצע, כל הכרטיס מבצע "פעימה" קצרה וזוהרת (tapPulse), כדי לתת לעובד פידבק ברור שהפעולה נקלטה.

זה שדרוג שנותן תחושה חיה, "תאורתית" ומודרנית שמתאימה בול לאווירה שעשינו.
