<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Pro Dark - ניהול חכם</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            background-attachment: fixed;
            color: #f8fafc;
        }

        .glass-dark {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-tab {
            transition: all 0.3s ease;
            background: rgba(51, 65, 85, 0.5);
            color: #94a3b8;
        }

        .category-tab.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* עיצוב פס גלילה */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-5xl mx-auto p-4 md:p-6">
        <header class="flex justify-between items-center mb-10 glass-dark p-6 rounded-3xl shadow-2xl">
            <div class="flex items-center gap-4">
                <div class="bg-blue-500 p-3 rounded-2xl text-white shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-shop text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">קיוסק <span class="text-blue-500">יצחק</span></h1>
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Premium Management</p>
                </div>
            </div>
            <button onclick="toggleAdmin()" id="toggleBtn" class="bg-blue-600/10 text-blue-400 border border-blue-500/30 px-6 py-2.5 rounded-2xl font-bold hover:bg-blue-600 hover:text-white transition-all flex items-center gap-2 text-sm">
                <span>מצב ניהול</span> <i class="fa-solid fa-screwdriver-wrench"></i>
            </button>
        </header>

        <div id="adminPanel" class="hidden glass-dark p-6 md:p-8 rounded-3xl shadow-2xl mb-10 border-t-2 border-blue-500/50 animate-in fade-in duration-500">
            <div class="flex items-center gap-3 mb-8">
                <h2 class="text-xl font-bold text-white">הוספת מוצר חדש למלאי</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 text-right">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 mr-2">שם המוצר</label>
                    <input type="text" id="itemName" placeholder="לדוגמה: פחית קולה" class="w-full p-4 rounded-2xl bg-slate-800/50 border border-slate-700 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 mr-2">מחיר (₪)</label>
                    <input type="number" id="itemPrice" placeholder="0.00" class="w-full p-4 rounded-2xl bg-slate-800/50 border border-slate-700 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 mr-2">קטגוריה</label>
                    <select id="itemCategory" class="w-full p-4 rounded-2xl bg-slate-800/50 border border-slate-700 text-white focus:ring-2 focus:ring-blue-500 outline-none font-bold">
                        <option value="שתייה">🥤 שתייה</option>
                        <option value="חטיפים">🍿 חטיפים</option>
                        <option value="סיגריות">🚬 סיגריות</option>
                        <option value="אחר">📦 אחר</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 mr-2">בחירת תמונה</label>
                    <input type="file" id="itemFile" accept="image/*" class="w-full p-3 rounded-2xl bg-slate-800/50 border border-slate-700 text-xs text-slate-400 cursor-pointer">
                </div>
            </div>
            <button onclick="addProduct()" id="addBtn" class="mt-8 bg-blue-600 text-white font-bold px-12 py-4 rounded-2xl hover:bg-blue-500 w-full md:w-auto shadow-xl shadow-blue-900/20 transition-all active:scale-95">
                פרסם לקטלוג <i class="fa-solid fa-cloud-arrow-up mr-2"></i>
            </button>
            <div id="status" class="mt-4 text-center font-bold text-blue-400 hidden animate-pulse"></div>
        </div>

        <nav class="flex flex-wrap gap-3 mb-12 justify-center">
            <button onclick="filterItems('הכל')" class="category-tab active px-10 py-3 rounded-2xl font-bold">הכל</button>
            <button onclick="filterItems('שתייה')" class="category-tab px-10 py-3 rounded-2xl font-bold">שתייה</button>
            <button onclick="filterItems('חטיפים')" class="category-tab px-10 py-3 rounded-2xl font-bold">חטיפים</button>
            <button onclick="filterItems('סיגריות')" class="category-tab px-10 py-3 rounded-2xl font-bold">סיגריות</button>
        </nav>

        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let currentFilter = 'הכל';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            document.getElementById('toggleBtn').innerHTML = isAdmin ? 'מצב תצוגה <i class="fa-solid fa-eye ml-2"></i>' : 'מצב ניהול <i class="fa-solid fa-screwdriver-wrench ml-2"></i>';
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            if (data.success) return data.data.url;
            throw new Error("העלאת התמונה נכשלה");
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            const status = document.getElementById('status');

            if (!name || !price || !file) return alert("מלא את כל הפרטים!");

            try {
                document.getElementById('addBtn').disabled = true;
                status.innerText = "⏳ מעלה נתונים לענן..."; 
                status.classList.remove('hidden');
                
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), category, image: imageUrl, createdAt: serverTimestamp() });
                
                status.innerText = "✅ המוצר נוסף בהצלחה!";
                document.getElementById('itemName').value = ''; 
                document.getElementById('itemPrice').value = '';
                document.getElementById('itemFile').value = '';
                setTimeout(() => status.classList.add('hidden'), 3000);
            } catch (e) { alert("שגיאה: " + e.message); }
            finally { document.getElementById('addBtn').disabled = false; }
        };

        window.deleteItem = async (id) => {
            if (confirm("האם למחוק את המוצר לצמיתות?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("עדכון מחיר:", oldPrice);
            if (newPrice && !isNaN(newPrice)) {
                await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
            }
        };

        window.filterItems = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.category-tab').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === cat);
            });
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                if (currentFilter !== 'הכל' && item.category !== currentFilter) return;

                grid.innerHTML += `
                    <div class="product-card glass-dark rounded-[2.5rem] overflow-hidden flex flex-col h-full group">
                        <div class="h-52 bg-white/5 flex items-center justify-center p-6 relative">
                            <img src="${item.image}" class="max-w-full max-h-full object-contain drop-shadow-2xl">
                            <span class="absolute top-4 left-4 text-[10px] bg-blue-500/20 text-blue-400 px-3 py-1.5 rounded-xl font-black uppercase tracking-wider border border-blue-500/20">${item.category}</span>
                        </div>
                        <div class="p-6 flex flex-col flex-grow bg-slate-900/40">
                            <h3 class="font-bold text-white text-lg mb-2 truncate">${item.name}</h3>
                            <div class="mt-auto flex items-center justify-between">
                                <p class="text-blue-400 font-black text-2xl">₪${item.price}</p>
                                ${isAdmin ? `
                                    <div class="flex gap-2">
                                        <button onclick="updatePrice('${doc.id}', ${item.price})" class="bg-blue-500/10 text-blue-400 w-10 h-10 rounded-2xl flex items-center justify-center hover:bg-blue-500 hover:text-white transition-all"><i class="fa-solid fa-pen-to-square text-sm"></i></button>
                                        <button onclick="deleteItem('${doc.id}')" class="bg-red-500/10 text-red-400 w-10 h-10 rounded-2xl flex items-center justify-center hover:bg-red-500 hover:text-white transition-all"><i class="fa-solid fa-trash-can text-sm"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            if (grid.innerHTML === '') {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500 font-bold">לא נמצאו מוצרים בקטגוריה זו</div>`;
            }
        }
    </script>
</body>
</html>
