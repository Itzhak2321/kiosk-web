<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Pro Dark - 3 Columns</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap');
        body { 
            font-family: 'Assistant', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            background-attachment: fixed;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        .glass-dark {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .category-tab { transition: all 0.3s ease; background: rgba(51, 65, 85, 0.5); color: #94a3b8; }
        .category-tab.active { background: #3b82f6; color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .product-card { transition: all 0.2s ease; }
        /* מניעת שבירת מילים בשמות ארוכים */
        .product-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.5rem; line-height: 1.25rem; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-6xl mx-auto p-2 md:p-6">
        <header class="flex justify-between items-center mb-6 glass-dark p-4 rounded-2xl shadow-2xl">
            <h1 class="text-xl font-extrabold tracking-tight">קיוסק <span class="text-blue-500">יצחק</span></h1>
            <button onclick="toggleAdmin()" id="toggleBtn" class="bg-blue-600/10 text-blue-400 border border-blue-500/30 px-4 py-2 rounded-xl font-bold text-xs">
                ניהול <i class="fa-solid fa-screwdriver-wrench mr-1"></i>
            </button>
        </header>

        <div id="adminPanel" class="hidden glass-dark p-4 rounded-2xl shadow-2xl mb-6 border-t-2 border-blue-500/50">
            <div class="grid grid-cols-1 gap-4 text-right">
                <input type="text" id="itemName" placeholder="שם מוצר" class="w-full p-3 rounded-xl bg-slate-800/50 border border-slate-700 text-white outline-none">
                <div class="flex gap-2">
                    <input type="number" id="itemPrice" placeholder="מחיר" class="w-1/2 p-3 rounded-xl bg-slate-800/50 border border-slate-700 text-white outline-none">
                    <select id="itemCategory" class="w-1/2 p-3 rounded-xl bg-slate-800/50 border border-slate-700 text-white outline-none font-bold">
                        <option value="שתייה">🥤 שתייה</option>
                        <option value="חטיפים">🍿 חטיפים</option>
                        <option value="סיגריות">🚬 סיגריות</option>
                        <option value="אחר">📦 אחר</option>
                    </select>
                </div>
                <input type="file" id="itemFile" accept="image/*" class="w-full p-2 text-xs text-slate-400">
                <button onclick="addProduct()" id="addBtn" class="bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-500 transition-all">
                    הוסף מוצר לקטלוג
                </button>
                <div id="status" class="text-center font-bold text-blue-400 hidden text-sm"></div>
            </div>
        </div>

        <nav class="flex overflow-x-auto gap-2 mb-8 no-scrollbar pb-2">
            <button onclick="filterItems('הכל')" class="category-tab active px-6 py-2 rounded-xl font-bold flex-shrink-0 text-sm">הכל</button>
            <button onclick="filterItems('שתייה')" class="category-tab px-6 py-2 rounded-xl font-bold flex-shrink-0 text-sm">שתייה</button>
            <button onclick="filterItems('חטיפים')" class="category-tab px-6 py-2 rounded-xl font-bold flex-shrink-0 text-sm">חטיפים</button>
            <button onclick="filterItems('סיגריות')" class="category-tab px-6 py-2 rounded-xl font-bold flex-shrink-0 text-sm">סיגריות</button>
        </nav>

        <div id="productsGrid" class="grid grid-cols-3 gap-2 md:gap-6">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let currentFilter = 'הכל';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            return data.data.url;
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            const status = document.getElementById('status');
            if (!name || !price || !file) return alert("מלא פרטים!");

            try {
                status.innerText = "מעלה..."; status.classList.remove('hidden');
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), category, image: imageUrl, createdAt: serverTimestamp() });
                status.innerText = "נוסף!";
                setTimeout(() => status.classList.add('hidden'), 2000);
            } catch (e) { alert(e.message); }
        };

        window.deleteItem = async (id) => {
            if (confirm("למחוק?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("מחיר חדש:", oldPrice);
            if (newPrice) await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
        };

        window.filterItems = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.category-tab').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === cat);
            });
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                if (currentFilter !== 'הכל' && item.category !== currentFilter) return;

                grid.innerHTML += `
                    <div class="product-card glass-dark rounded-2xl overflow-hidden flex flex-col h-full border border-white/5">
                        <div class="h-28 bg-white/5 flex items-center justify-center p-2 relative">
                            <img src="${item.image}" class="max-w-full max-h-full object-contain">
                        </div>
                        <div class="p-2 flex flex-col flex-grow bg-slate-900/40 text-center">
                            <h3 class="product-title font-semibold text-white text-[11px] mb-1">${item.name}</h3>
                            <p class="text-blue-400 font-bold text-sm">₪${item.price}</p>
                            ${isAdmin ? `
                                <div class="flex gap-1 mt-2 justify-center">
                                    <button onclick="updatePrice('${doc.id}', ${item.price})" class="bg-blue-500/20 text-blue-400 w-7 h-7 rounded-lg flex items-center justify-center text-[10px]"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteItem('${doc.id}')" class="bg-red-500/20 text-red-400 w-7 h-7 rounded-lg flex items-center justify-center text-[10px]"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
