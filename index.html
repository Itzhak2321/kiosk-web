<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחירון קיוסק</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap');
        
        body { 
            font-family: 'Assistant', sans-serif; 
            background-color: #1e293b; /* רקע כחול-כהה כמו בצילום מסך */
            color: #ffffff;
            margin: 0;
        }

        .product-card {
            background-color: #2d3748;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .admin-footer {
            background: rgba(255, 255, 255, 0.95);
            color: black;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            padding: 15px;
            border-radius: 2rem;
            text-align: center;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
            cursor: pointer;
        }

        /* מניעת עיוות תמונה */
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <header class="p-6 text-center">
        <h1 class="text-4xl font-extrabold tracking-tight">מחירון קיוסק <span class="text-slate-400 font-light">יצחק</span></h1>
    </header>

    <div class="max-w-4xl mx-auto p-4">
        
        <div id="adminPanel" class="hidden mb-10 p-6 bg-slate-800 rounded-3xl border-2 border-white/10">
            <h2 class="text-xl font-bold mb-4 text-center">הוספת מוצר חדש</h2>
            <div class="space-y-4">
                <input type="text" id="itemName" placeholder="שם המוצר" class="w-full p-4 rounded-2xl bg-slate-900 border-none outline-none text-lg">
                <input type="number" id="itemPrice" placeholder="מחיר ב-₪" class="w-full p-4 rounded-2xl bg-slate-900 border-none outline-none text-lg">
                <select id="itemCategory" class="w-full p-4 rounded-2xl bg-slate-900 border-none outline-none text-lg">
                    <option value="שתייה">🥤 שתייה</option>
                    <option value="חטיפים">🍿 חטיפים</option>
                    <option value="סיגריות">🚬 סיגריות</option>
                    <option value="אחר">📦 אחר</option>
                </select>
                <input type="file" id="itemFile" class="w-full p-2 text-sm text-slate-400">
                <button onclick="addProduct()" id="addBtn" class="w-full bg-blue-500 text-white font-bold py-4 rounded-2xl text-xl">שמור מוצר</button>
            </div>
        </div>

        <div class="mb-8">
            <input type="text" id="searchInput" oninput="searchProducts()" placeholder="חפש מוצר..." class="w-full p-5 rounded-2xl bg-slate-800/50 border border-white/10 text-xl outline-none">
        </div>

        <div id="productsGrid" class="grid grid-cols-2 gap-4">
            </div>
    </div>

    <div class="admin-footer" onclick="toggleAdmin()">
        <span id="adminBtnText">מצב עריכה</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC98bjwab2vlA9MYte7mjsDwKTvp7hW6Gs",
            authDomain: "kiosk-web-55899.firebaseapp.com",
            projectId: "kiosk-web-55899",
            storageBucket: "kiosk-web-55899.firebasestorage.app",
            messagingSenderId: "593665505846",
            appId: "1:593665505846:web:df4c0982776560e4803697"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "8186ffc22c58e0157c43a8f56cfad311";

        let isAdmin = false;
        let searchQuery = '';

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('hidden');
            document.getElementById('adminBtnText').innerText = isAdmin ? 'צא ממצב עריכה' : 'מצב עריכה';
            renderProducts(window.lastSnapshot);
        };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            return data.data.url;
        }

        window.addProduct = async () => {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            if (!name || !price || !file) return alert("מלא פרטים!");

            try {
                const imageUrl = await uploadImage(file);
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), category, image: imageUrl, createdAt: serverTimestamp() });
                location.reload();
            } catch (e) { alert(e.message); }
        };

        window.deleteItem = async (id) => {
            if (confirm("למחוק?")) await deleteDoc(doc(db, "products", id));
        };

        window.updatePrice = async (id, oldPrice) => {
            const newPrice = prompt("מחיר חדש:", oldPrice);
            if (newPrice) await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
        };

        window.searchProducts = () => {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(window.lastSnapshot);
        };

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            window.lastSnapshot = snapshot;
            renderProducts(snapshot);
        });

        function renderProducts(snapshot) {
            if (!snapshot) return;
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                if (item.name.toLowerCase().includes(searchQuery)) {
                    grid.innerHTML += `
                        <div class="product-card flex flex-col">
                            <div class="h-56 w-full img-container bg-white/5">
                                <img src="${item.image}">
                            </div>
                            <div class="p-4 flex flex-col flex-grow text-center justify-center space-y-2">
                                <h3 class="text-2xl font-bold leading-tight">${item.name}</h3>
                                <p class="text-4xl font-black">₪${item.price}</p>
                                ${isAdmin ? `
                                    <div class="flex gap-4 justify-center mt-2 border-t border-white/10 pt-2">
                                        <button onclick="updatePrice('${doc.id}', ${item.price})" class="text-white bg-blue-500 p-2 rounded-lg"><i class="fa-solid fa-pen text-sm"></i></button>
                                        <button onclick="deleteItem('${doc.id}')" class="text-white bg-red-500 p-2 rounded-lg"><i class="fa-solid fa-trash text-sm"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
